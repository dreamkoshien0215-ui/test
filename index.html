<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Firebase の接続設定（空なら「この端末のみ」で動作）。設定方法は docs/SETUP.md -->

<body>
<!-- @@ARTIFACT_START@@ ここから下が公開ページ本体（tools/build_artifact.py が切り出す） -->
<title>10分タイムテーブル</title>
<style>
  :root {
    --h: 20px;            /* 1スロット(10分)の高さ。ズームで変更 */
    --timew: 52px;
    --colw: 150px;
    --bg: #fbfcfe; --fg: #1c2330; --muted: #667085;
    --line: #e9edf3; --line-strong: #c3cad6; --head: #f1f4f9;
    --accent: #2563eb; --accent-soft: rgba(37, 99, 235, .14); --now: #e5484d;
    --toast-bg: #1c2330; --toast-fg: #ffffff; --danger: #d92d20;
    --ok: #12805c; --warn: #b54708;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f131a; --fg: #e4e8ef; --muted: #98a2b3;
      --line: #1c222c; --line-strong: #353e4c; --head: #161b24;
      --accent: #5b8def; --accent-soft: rgba(91, 141, 239, .2);
      --toast-bg: #e4e8ef; --toast-fg: #0f131a; --danger: #f97066;
      --ok: #47cd89; --warn: #fdb022;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f131a; --fg: #e4e8ef; --muted: #98a2b3;
    --line: #1c222c; --line-strong: #353e4c; --head: #161b24;
    --accent: #5b8def; --accent-soft: rgba(91, 141, 239, .2);
    --toast-bg: #e4e8ef; --toast-fg: #0f131a; --danger: #f97066;
    --ok: #47cd89; --warn: #fdb022;
  }
  @media (max-width: 600px) {
    :root { --timew: 44px; --colw: 120px; }
    header h1 { flex: 1 0 100%; }
    header button { padding: 6px 8px; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; min-height: 36px; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, select { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 6px 8px; min-height: 36px; }
  @media (max-width: 600px) { input, select, textarea { font-size: 16px; } }

  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px;
    border-bottom: 1px solid var(--line-strong); background: var(--head); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .spacer { flex: 1; }
  .status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    border: 1px solid currentColor; color: var(--muted); }
  .status.shared { color: var(--ok); }
  .status.local { color: var(--warn); }

  /* タイムテーブル */
  #scroller { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
  .board { display: flex; min-width: 100%; width: max-content; }
  .timecol { position: sticky; left: 0; z-index: 3; background: var(--bg); width: var(--timew);
    flex: none; border-right: 1px solid var(--line-strong); }
  .corner, .colhead { position: sticky; top: 0; height: 40px; background: var(--head);
    border-bottom: 1px solid var(--line-strong); z-index: 2; }
  .corner { z-index: 4; }
  .tlabel { height: var(--h); font-size: 11px; color: var(--muted); text-align: right;
    padding-right: 6px; font-variant-numeric: tabular-nums; }
  .tlabel span { position: relative; top: -7px; }
  .tlabel:first-of-type span { top: 0; }
  .col { min-width: var(--colw); flex: 1 0 var(--colw); border-right: 1px solid var(--line); }
  .colhead { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-weight: 600;
    font-size: 14px; white-space: nowrap; overflow: hidden; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .slots { position: relative; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; }
  .cell { height: var(--h); border-bottom: 1px dashed var(--line); }
  .cell.half { border-bottom: 1px solid var(--line); }
  .cell.hour { border-bottom: 1px solid var(--line-strong); }
  .cell:hover { background: var(--accent-soft); }
  .ev { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 1px 6px; font-size: 12px;
    line-height: 1.35; overflow: hidden; color: #fff; cursor: pointer; z-index: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .ev small { opacity: .9; margin-left: 4px; }
  .preview { position: absolute; left: 2px; right: 2px; border: 2px dashed var(--accent);
    background: var(--accent-soft); border-radius: 6px; pointer-events: none; z-index: 2;
    font-size: 11px; color: var(--accent); padding: 0 4px; font-weight: 600; }
  .nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--now);
    z-index: 2; pointer-events: none; }
  .empty { margin: 48px auto; max-width: 360px; padding-inline: 16px; text-align: center; display: grid; gap: 12px;
    color: var(--muted); line-height: 1.6; }
  .empty strong { color: var(--fg); font-size: 16px; }

  /* ダイアログ・トースト */
  dialog { border: none; border-radius: 12px; padding: 0; width: min(440px, 94vw);
    background: var(--bg); color: var(--fg); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog form { padding: 16px; display: grid; gap: 10px; }
  dialog h2 { margin: 0 0 4px; font-size: 18px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > * { flex: 1; min-width: 90px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .actions .danger { margin-right: auto; }
  .member-row { display: flex; gap: 6px; align-items: center; }
  .member-row input[type=text] { flex: 1; min-width: 0; }
  .member-row input[type=color] { width: 44px; padding: 2px; }
  .err { color: var(--danger); font-size: 13px; margin: 0; }
  textarea { width: 100%; height: 180px; font: 12px ui-monospace, monospace; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; }
  .note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.5; }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    max-width: 92vw; background: var(--toast-bg); color: var(--toast-fg); padding: 10px 14px; border-radius: 10px;
    font-size: 14px; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #printDlg { width: min(640px, 94vw); }
  .sheets { display: grid; gap: 10px; max-height: 55vh; overflow: auto; }
  .sheet { display: block; width: 100%; height: auto; background: #fff;
    border: 1px solid var(--line-strong); border-radius: 4px; -webkit-touch-callout: default; }
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    html, body { height: auto; background: #fff; }
    #printArea { display: block; }
    #printArea img { display: block; width: 100%; height: 100vh; object-fit: contain; break-after: page; }
    #printArea img:last-child { break-after: auto; }
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

    <button id="members">👥 メンバー</button>

<div id="scroller"><div class="board" id="board"></div></div>

<!-- 予定の追加・編集 -->

</dialog>

<div id="printArea"></div>
<style id="printPage"></style>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ===== 定数・ユーティリティ =====
  const SLOTS = 144;                         // 24時間 × 6スロット(10分)
  const KEY = 'tenmin-schedule-v1';          // この端末だけモードの保存先
  const NOTIFIED_KEY = 'tenmin-notified-v1';
  const ZOOM_KEY = 'tenmin-zoom';
  const NOTIFY_FOR_KEY = 'tenmin-notify-for';
  const COLORS = ['#2563eb', '#16a34a', '#db2777', '#ea580c', '#7c3aed', '#0891b2', '#ca8a04', '#475569'];
  const ZOOMS = [{ h: 12, label: '小' }, { h: 20, label: '標準' }, { h: 32, label: '大' }];
  // claude.ai の中（iframe）で開かれているか。中では印刷画面やファイル保存が使えない
  const FRAMED = (() => { try { return window.top !== window.self; } catch { return true; } })();

  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const slotLabel = (s) => `${pad(Math.floor(s / 6))}:${pad((s % 6) * 10)}`;
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => dateStr(new Date());
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function readJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ストレージが使えない環境 */ }
  }

  // 共有データは他人が書いた値なので、描画前に形をそろえる
  function cleanMember(id, d) {
    return {
      id: String(id),
      name: String(d.name ?? '名無し').slice(0, 20) || '名無し',
      color: /^#[0-9a-fA-F]{6}$/.test(d.color) ? d.color : COLORS[0],
      order: Number(d.order) || 0,
    };
  }
  function cleanEvent(id, d) {
    const start = Math.max(0, Math.min(SLOTS - 1, Math.floor(Number(d.start)) || 0));
    const end = Math.max(start + 1, Math.min(SLOTS, Math.floor(Number(d.end)) || start + 1));
    return {
      id: String(id),
      date: /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : '1970-01-01',
      memberId: String(d.memberId ?? ''),
      start, end,
      title: String(d.title ?? '').slice(0, 60),
      remind: [0, 5, 10, 15, 30, 60].includes(Number(d.remind)) ? Number(d.remind) : 0,
      updatedAt: Number(d.updatedAt) || 0,
    };
  }
  const byOrder = (a, b) => a.order - b.order || a.name.localeCompare(b.name);

  // ===== 状態 =====
  let state = { members: [], events: [] };
  let mode = 'loading';     // 'loading' | 'shared'（全員で共有） | 'local'（この端末だけ）
  let db = null;
  let backend = '';         // 共有モードの保存先: 'claude'（claude.ai の共有データ） | 'firebase'
  let readOnly = false;
  let curDate = todayStr();
  let anchor = null;        // タップ操作の開始マス {memberId, slot}
  let editingId = null;     // 編集中の予定ID

  function sampleState() {
    const me = uid(), a = uid(), b = uid(), t = todayStr(), now = Date.now();
    const ev = (memberId, start, end, title, remind = 10) => ({ id: uid(), date: t, memberId, start, end, title, remind, updatedAt: now });
    return {
      members: [
        { id: me, name: '自分', color: COLORS[0], order: 1 },
        { id: a, name: '田中（例）', color: COLORS[1], order: 2 },
        { id: b, name: '佐藤（例）', color: COLORS[2], order: 3 },
      ],
      events: [
        ev(me, 54, 57, '朝会（例）'), ev(me, 60, 69, '資料作成（例）', 0), ev(me, 84, 90, '打ち合わせ（例）'),
        ev(a, 54, 57, '朝会（例）'), ev(a, 66, 72, '外出（例）', 30), ev(a, 102, 105, '電話（例）', 5),
        ev(b, 57, 63, 'レビュー（例）'), ev(b, 72, 78, '昼休み（例）', 0), ev(b, 96, 108, '作業（例）', 0),
      ],
    };
  }
  function loadLocal() {
    const s = readJSON(KEY, null);
    if (s && Array.isArray(s.members) && Array.isArray(s.events) && s.members.length) {
      return {
        members: s.members.map((m, i) => cleanMember(m.id, { order: i + 1, ...m })).sort(byOrder),
        events: s.events.map((e) => cleanEvent(e.id, e)),
      };
    }
    return sampleState();
  }
  const saveLocal = () => writeJSON(KEY, state);

  // ===== データ操作（共有モードは db へ、この端末モードは localStorage へ） =====
  const body = (o) => { const { id, ...rest } = o; return rest; };

  async function dbWrite(fn) {
    try { await fn(); return true; } catch (e) {
      if (e && e.code === 'unavailable') {
        await sleep(400 + Math.random() * 800);
        try { await fn(); return true; } catch (e2) { e = e2; }
      }
      reportWriteError(e);
      return false;
    }
  }
  function reportWriteError(e) {
    const code = e && e.code;
    if (code === 'rejected') {
      toast('保存できませんでした。入力内容を確認して、もう一度お試しください。', 5000);
    } else if (code === 'invalid_argument') {
      readOnly = true;
      updateStatus();
      toast('このページを編集する権限がありません。作成者に「編集者」として招待してもらってください。', 7000);
    } else if (code === 'quota_exceeded') {
      toast('保存できる件数の上限に達しました。古い予定を削除してから保存してください。', 7000);
    } else if (code === 'resource_exhausted') {
      toast('操作が集中しています。少し待ってからもう一度保存してください。', 5000);
    } else {
      toast('保存できませんでした。通信状態を確認して、もう一度お試しください。', 5000);
    }
  }

  async function putEvent(ev) {
    if (mode === 'shared') return dbWrite(() => db.collection('events').doc(ev.id).set(body(ev)));
    const i = state.events.findIndex((x) => x.id === ev.id);
    if (i >= 0) state.events[i] = ev; else state.events.push(ev);
    saveLocal(); render(); return true;
  }
  async function removeEvent(id) {
    if (mode === 'shared') return dbWrite(() => db.collection('events').doc(id).delete());
    state.events = state.events.filter((x) => x.id !== id);
    saveLocal(); render(); return true;
  }
  async function putMember(m) {
    if (mode === 'shared') return dbWrite(() => db.collection('members').doc(m.id).set(body(m)));
    const i = state.members.findIndex((x) => x.id === m.id);
    if (i >= 0) state.members[i] = m; else state.members.push(m);
    state.members.sort(byOrder);
    saveLocal(); render(); return true;
  }
  async function removeMember(id) {
    if (mode === 'shared') {
      for (const ev of state.events.filter((x) => x.memberId === id)) {
        if (!(await dbWrite(() => db.collection('events').doc(ev.id).delete()))) return false;
      }
      return dbWrite(() => db.collection('members').doc(id).delete());
    }
    state.members = state.members.filter((x) => x.id !== id);
    state.events = state.events.filter((x) => x.memberId !== id);
    saveLocal(); render(); return true;
  }
  async function replaceAll(next) {
    if (mode === 'shared') {
      toast('読み込み中…', 10000);
      for (const ev of state.events) if (!(await dbWrite(() => db.collection('events').doc(ev.id).delete()))) return false;
      for (const m of state.members) if (!(await dbWrite(() => db.collection('members').doc(m.id).delete()))) return false;
      for (const m of next.members) if (!(await dbWrite(() => db.collection('members').doc(m.id).set(body(m))))) return false;
      for (const ev of next.events) if (!(await dbWrite(() => db.collection('events').doc(ev.id).set(body(ev))))) return false;
      return true;
    }
    state = next; saveLocal(); render(); return true;
  }

  // ===== 描画 =====
  const board = $('#board');
  const previewEl = document.createElement('div');
  previewEl.className = 'preview';

  function updateStatus() {
    const el = $('#status');
    el.className = 'status ' + (mode === 'loading' || mode === 'noboard' ? '' : mode);
    el.textContent = mode === 'loading' ? '接続中…' : mode === 'noboard' ? '未作成'

      : 'この端末のみ';
    el.title = mode === 'shared' ? '予定はこのページを開いている全員にリアルタイムで反映されます'
      : mode === 'local' ? '予定はこのブラウザの中だけに保存されます' : '';
    $('#invite').hidden = !(mode === 'shared' && backend === 'firebase');
    $('#memberNote').textContent = mode === 'shared'
      ? 'メンバーと予定は、このページを開いている全員に共有されます。'
      : '※ いまはこの端末のブラウザ内だけに保存されます（他の人とは共有されません）。';
  }

  function render() {
    board.innerHTML = '';
    if (mode === 'loading') {
      board.innerHTML = '<div class="empty"><strong>読み込み中…</strong></div>';
      return;
    }
    if (mode === 'noboard') {
      board.innerHTML = `<div class="empty"><strong>10分単位で予定を共有</strong>
        <span>予定表を作って、招待リンクを仲間に送るだけで一緒に使えます。ログインは不要です。</span>
        <button class="primary" id="newBoard">＋ 新しい予定表を作る</button>
        <span class="note">招待リンクをもらった人は、そのリンクを開いてください。</span></div>`;
      $('#newBoard').addEventListener('click', createBoard);
      return;
    }
    if (!state.members.length) {
      board.innerHTML = `<div class="empty"><strong>まだメンバーがいません</strong>
        <span>まず自分の名前を追加しましょう。仲間もそれぞれ自分の列を追加できます。</span>
        <button class="primary" id="emptyAdd">＋ メンバーを追加</button></div>`;
      $('#emptyAdd').addEventListener('click', openMembers);

    }

    const timecol = document.createElement('div');
    timecol.className = 'timecol';
    timecol.innerHTML = '<div class="corner"></div>' + Array.from({ length: SLOTS }, (_, i) =>
      `<div class="tlabel">${i % 6 === 0 ? `<span>${slotLabel(i)}</span>` : ''}</div>`).join('');
    board.append(timecol);

    const cells = Array.from({ length: SLOTS }, (_, i) =>
      `<div class="cell${i % 6 === 5 ? ' hour' : i % 3 === 2 ? ' half' : ''}"></div>`).join('');

    for (const m of state.members) {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<div class="colhead"><span class="dot" style="background:${esc(m.color)}"></span>${esc(m.name)}</div>` +
        `<div class="slots" data-member="${esc(m.id)}">${cells}</div>`;
      board.append(col);

      const slots = col.querySelector('.slots');
      for (const ev of state.events) {
        if (ev.date !== curDate || ev.memberId !== m.id) continue;
        const el = document.createElement('div');
        el.className = 'ev';
        el.style.top = `calc(var(--h) * ${ev.start} + 1px)`;
        el.style.height = `calc(var(--h) * ${ev.end - ev.start} - 2px)`;
        el.style.background = m.color;
        el.title = `${ev.title || '(無題)'} ${slotLabel(ev.start)}–${slotLabel(ev.end)}`;
        el.innerHTML = `<b>${esc(ev.title || '(無題)')}</b><small>${slotLabel(ev.start)}–${slotLabel(ev.end)}${ev.remind ? ' 🔔' : ''}</small>`;
        el.addEventListener('click', () => openEditor(ev));
        slots.append(el);
      }
      attachPointer(slots);
    }

    if (anchor) {
      const s = board.querySelector(`.slots[data-member="${CSS.escape(anchor.memberId)}"]`);
      if (s) showPreview(s, anchor.slot, anchor.slot + 1); else anchor = null;
    }
    drawNowLine();
  }

  function showPreview(slots, a, b) {
    previewEl.style.top = `calc(var(--h) * ${a})`;
    previewEl.style.height = `calc(var(--h) * ${b - a})`;
    previewEl.textContent = `${slotLabel(a)}–${slotLabel(b)}`;
    if (previewEl.parentNode !== slots) slots.append(previewEl);
  }
  function hidePreview() { previewEl.remove(); }
  function clearAnchor() { anchor = null; hidePreview(); }

  function drawNowLine() {
    document.querySelectorAll('.nowline').forEach((n) => n.remove());
    if (curDate !== todayStr()) return;
    const d = new Date();
    const slot = (d.getHours() * 60 + d.getMinutes()) / 10;
    document.querySelectorAll('.slots').forEach((s) => {
      const line = document.createElement('div');
      line.className = 'nowline';
      line.style.top = `calc(var(--h) * ${slot})`;
      s.append(line);
    });
  }

  function slotHeight() {
    const c = board.querySelector('.cell');
    return c ? c.getBoundingClientRect().height : ZOOMS[zoomIdx].h;
  }
  function scrollToNow() {
    const d = new Date();
    const slot = Math.floor((d.getHours() * 60 + d.getMinutes()) / 10);
    $('#scroller').scrollTop = Math.max(0, (slot - 6) * slotHeight());
  }

  // ===== 操作（マウス: ドラッグで範囲選択 / タッチ: 開始マス→終了マスの2タップ） =====
  function slotAt(slots, e) {
    const r = slots.getBoundingClientRect();
    const s = Math.floor((e.clientY - r.top) / (r.height / SLOTS));
    return Math.max(0, Math.min(SLOTS - 1, s));
  }

  function attachPointer(slots) {
    const memberId = slots.dataset.member;
    let drag = null;

    slots.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ev')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const s = slotAt(slots, e);
      drag = { start: s, end: s, x: e.clientX, y: e.clientY, mouse: e.pointerType === 'mouse', moved: false };
      if (drag.mouse) {
        slots.setPointerCapture(e.pointerId);
        showPreview(slots, s, s + 1);
      }
    });

    slots.addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
      if (drag.mouse) {
        drag.end = slotAt(slots, e);
        showPreview(slots, Math.min(drag.start, drag.end), Math.max(drag.start, drag.end) + 1);
      }
    });

    slots.addEventListener('pointerup', () => {
      if (!drag) return;
      const d = drag; drag = null;
      if (d.mouse && d.end !== d.start) {
        clearAnchor();
        openEditor({ memberId, start: Math.min(d.start, d.end), end: Math.max(d.start, d.end) + 1 });
        return;
      }
      if (d.moved) return;          // スクロール操作だった
      tapSlot(slots, memberId, d.start);
    });

    slots.addEventListener('pointercancel', () => {
      drag = null;                  // タッチでスクロールが始まった
      if (!anchor) hidePreview();
    });
  }

  function tapSlot(slots, memberId, s) {
    if (readOnly) return toast('閲覧のみのため、予定は追加できません。');
    if (anchor && anchor.memberId === memberId) {
      const a = Math.min(anchor.slot, s), b = Math.max(anchor.slot, s) + 1;
      clearAnchor();
      openEditor({ memberId, start: a, end: b });
    } else {
      anchor = { memberId, slot: s };
      showPreview(slots, s, s + 1);
      toast(`開始 ${slotLabel(s)} を選択 → 終了のマスをタップ（同じマスなら10分）`);
    }
  }

  // ===== 確認ダイアログ（confirm の代わり） =====
  const askDlg = $('#askDlg');
  let askResolve = null;
  function ask(msg, okLabel = 'OK') {
    $('#askMsg').textContent = msg;
    $('#askYes').textContent = okLabel;
    askDlg.showModal();
    return new Promise((res) => { askResolve = res; });
  }
  function closeAsk(v) { if (askResolve) { askResolve(v); askResolve = null; } if (askDlg.open) askDlg.close(); }
  $('#askForm').addEventListener('submit', (e) => { e.preventDefault(); closeAsk(true); });
  $('#askNo').addEventListener('click', () => closeAsk(false));
  askDlg.addEventListener('close', () => closeAsk(false));

  // ===== 予定ダイアログ =====
  const editor = $('#editor');
  $('#fStart').innerHTML = Array.from({ length: SLOTS }, (_, i) => `<option value="${i}">${slotLabel(i)}</option>`).join('');
  $('#fEnd').innerHTML = Array.from({ length: SLOTS }, (_, i) => `<option value="${i + 1}">${slotLabel(i + 1)}</option>`).join('');

  function openEditor(ev) {
    if (readOnly && !ev.id) return toast('閲覧のみのため、予定は追加できません。');
    editingId = ev.id || null;
    $('#editorTitle').textContent = editingId ? '予定を編集' : '予定を追加';
    $('#fTitle').value = ev.title || '';
    $('#fMember').innerHTML = state.members.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
    $('#fMember').value = ev.memberId;
    $('#fStart').value = ev.start;
    $('#fEnd').value = ev.end;
    $('#fRemind').value = ev.remind ?? 10;
    $('#fDelete').hidden = !editingId;
    $('#fError').hidden = true;
    editor.showModal();
    $('#fTitle').focus();
  }

  $('#editorForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#fError');
    const showErr = (msg) => { err.textContent = msg; err.hidden = false; };
    err.hidden = true;
    const data = {
      title: $('#fTitle').value.trim(),
      memberId: $('#fMember').value,
      start: Number($('#fStart').value),
      end: Number($('#fEnd').value),
      remind: Number($('#fRemind').value),
    };
    if (!state.members.some((m) => m.id === data.memberId)) return showErr('担当メンバーを選んでください。');
    if (data.end <= data.start) return showErr('終了時刻は開始時刻より後にしてください。');
    const target = editingId && state.events.find((x) => x.id === editingId);
    if (editingId && !target) return showErr('この予定は他の人が削除しました。キャンセルして画面を確認してください。');
    const date = target ? target.date : curDate;
    const clash = state.events.find((x) => x.date === date && x.memberId === data.memberId &&
      x.id !== editingId && x.start < data.end && data.start < x.end);
    if (clash) return showErr(`「${clash.title || '(無題)'}」(${slotLabel(clash.start)}–${slotLabel(clash.end)}) と重なっています。時間を変えてください。`);

    const ev = { ...(target || { id: uid(), date }), ...data, updatedAt: Date.now() };
    if (await putEvent(ev)) editor.close();
  });

  $('#fDelete').addEventListener('click', async () => {
    if (!editingId || !(await ask('この予定を削除しますか？', '削除'))) return;
    if (await removeEvent(editingId)) editor.close();
  });
  $('#fCancel').addEventListener('click', () => editor.close());

  // ===== メンバー管理 =====
  const memberDlg = $('#memberDlg');
  function renderMembers() {
    const list = $('#memberList');
    list.innerHTML = '';
    if (!state.members.length) list.innerHTML = '<p class="note">まだいません。「＋ メンバーを追加」から追加してください。</p>';
    for (const m of state.members) {
      const row = document.createElement('div');

      row.innerHTML = `<input type="color" value="${esc(m.color)}" aria-label="${esc(m.name)} の色">` +

        `<button type="button" class="danger" aria-label="${esc(m.name)} を削除">✕</button>`;
      const [color, name, del] = row.children;
      color.addEventListener('change', () => putMember({ ...m, color: color.value }));
      name.addEventListener('change', () => putMember({ ...m, name: name.value.trim() || '名無し' }));

      state.members.map((m) => `<option value="${esc(m.id)}">${esc(m.name)} の予定だけ</option>`).join('');
    sel.value = state.members.some((m) => m.id === cur) ? cur : '';
    $('#addMember').disabled = readOnly;
  }
  function openMembers() {
    if (mode === 'noboard' || mode === 'loading') return toast('まず予定表を作ってください。');
    renderMembers(); memberDlg.showModal();
  }
  $('#members').addEventListener('click', openMembers);
  $('#notifyFor').addEventListener('change', (e) => writeJSON(NOTIFY_FOR_KEY, e.target.value));
  $('#addMember').addEventListener('click', async () => {
    const n = state.members.length;

    if (!(await putMember(m))) return;

  // ===== 日付・ズーム =====
  const dateInput = $('#date');
  function setDate(d) {

  }
  function shiftDate(days) {

  dateInput.addEventListener('change', () => dateInput.value && setDate(dateInput.value));
  $('#prev').addEventListener('click', () => shiftDate(-1));
  $('#next').addEventListener('click', () => shiftDate(1));
  $('#today').addEventListener('click', () => { setDate(todayStr()); scrollToNow(); });

  let zoomIdx = Math.min(ZOOMS.length - 1, Math.max(0, Number(readJSON(ZOOM_KEY, 1)) || 0));
  function applyZoom(keepCenter) {
    const sc = $('#scroller');
    const centerSlot = keepCenter ? (sc.scrollTop + sc.clientHeight / 2) / slotHeight() : null;

  // ===== ファイル保存 =====
  // claude.ai の中では downloads 機能（保存前に確認が出る）、直接開いたときはふつうのダウンロード
  let downloads = null;
  function updateSaveButtons() {
    const can = !FRAMED || !!downloads;
    $('#exportFile').hidden = !can;
    $('#pSave').hidden = !can;
  }
  function dataUrlToBlob(url) {
    const bin = atob(url.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: 'image/png' });
  }
  async function saveFile(filename, blob) {
    if (downloads) {
      try { await downloads.save({ filename, data: blob }); return true; } catch (e) {
        if (e && e.code === 'declined') return false;
        if (e && e.code === 'rate_limited') { toast('保存の確認画面がすでに開いています。'); return false; }
        toast('この画面ではファイルを保存できません。', 5000);
        return false;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return true;
  }

  // ===== 書き出し / 読み込み（バックアップ） =====
  $('#export').addEventListener('click', () => {
    $('#exportText').value = JSON.stringify(state, null, 2);
    $('#exportCopy').textContent = 'コピー';
    $('#exportDlg').showModal();
  });
  $('#exportCopy').addEventListener('click', () => {
    const ta = $('#exportText'), btn = $('#exportCopy');
    const fallback = () => { ta.focus(); ta.select(); btn.textContent = '選択しました（長押しでコピー）'; };
    try { navigator.clipboard.writeText(ta.value).then(() => { btn.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
  });
  $('#exportFile').addEventListener('click', () =>
    saveFile(`schedule-${todayStr()}.json`, new Blob([$('#exportText').value], { type: 'application/json' })));
  $('#exportForm').addEventListener('submit', (e) => { e.preventDefault(); $('#exportDlg').close(); });

  $('#import').addEventListener('click', () => {
    if (readOnly) return toast('閲覧のみのため、読み込みはできません。');
    if (mode === 'noboard' || mode === 'loading') return toast('まず予定表を作ってください。');
    $('#importFile').click();
  });
  $('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let next;
    try {
      const s = JSON.parse(await file.text());
      if (!Array.isArray(s.members) || !Array.isArray(s.events)) throw new Error();
      next = {
        members: s.members.map((m, i) => cleanMember(m.id || uid(), { order: i + 1, ...m })).sort(byOrder),
        events: s.events.map((x) => cleanEvent(x.id || uid(), x)),
      };
    } catch {
      return toast('読み込めませんでした。このツールで書き出したJSONファイルを選んでください。', 5000);
    }
    const msg = mode === 'shared'
      ? '共有中のメンバーと予定をすべて、読み込んだ内容で置き換えますか？（全員の画面が変わります）'
      : '現在のデータを読み込んだ内容で置き換えますか？';
    if (!(await ask(msg, '置き換える'))) return;
    clearAnchor();
    if (await replaceAll(next)) toast('読み込みました');
  });

  // ===== 印刷・画像化（A4サイズの画像を描いて印刷／保存） =====
  const printDlg = $('#printDlg');
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const SHEET_FONT = '"Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif';
  // 1ページに載せるメンバー数の上限（これを超えると列が細くなり読めなくなるため分割）
  const COLS_PER_PAGE = { portrait: 6, landscape: 10 };
  let sheetUrls = [];
  $('#pFrom').innerHTML = Array.from({ length: 24 }, (_, i) => `<option value="${i}">${pad(i)}:00</option>`).join('');
  $('#pTo').innerHTML = Array.from({ length: 24 }, (_, i) => `<option value="${i + 1}">${pad(i + 1)}:00</option>`).join('');
  $('#pPrint').hidden = FRAMED;
  if (FRAMED) $('#pClose').className = 'primary';
  $('#pNote').textContent = FRAMED
    ? '「画像を保存」（または画像を長押し）で保存し、写真アプリやプリンターのアプリから印刷してください。'
    : 'PCは「印刷」でそのまま印刷できます。スマホは「画像を保存」してから、写真アプリなどで印刷してください。';

  function defaultRange() {
    const evs = state.events.filter((e) => e.date === curDate);
    if (!evs.length) return [8, 20];
    const a = Math.min(...evs.map((e) => e.start)), b = Math.max(...evs.map((e) => e.end));
    return [Math.min(8, Math.floor(a / 6)), Math.max(20, Math.ceil(b / 6))];
  }
  $('#print').addEventListener('click', () => {
    if (!state.members.length) return toast('メンバーを追加してから印刷してください。');
    const [f, t] = defaultRange();
    $('#pFrom').value = f; $('#pTo').value = t;
    $('#pOrient').value = state.members.length > 4 ? 'landscape' : 'portrait';
    printDlg.showModal();
    updateSheet();
  });
  ['#pFrom', '#pTo', '#pOrient'].forEach((id) => $(id).addEventListener('change', updateSheet));
  $('#printForm').addEventListener('submit', (e) => { e.preventDefault(); printDlg.close(); });

  function updateSheet() {
    const f = Number($('#pFrom').value);
    let t = Number($('#pTo').value);
    if (t <= f) { t = Math.min(24, f + 1); $('#pTo').value = t; }
    const orient = $('#pOrient').value;
    // ページ数を決めてから均等に割り振る（例: 20人・縦 → 5人×4ページ）
    const per = Math.ceil(state.members.length / Math.ceil(state.members.length / COLS_PER_PAGE[orient]));
    const pages = [];
    for (let i = 0; i < state.members.length; i += per) pages.push(state.members.slice(i, i + per));
    sheetUrls = pages.map((ms, i) => drawSheet(f, t, orient === 'landscape', ms, i + 1, pages.length).toDataURL('image/png'));
    const box = $('#pImgs');
    box.innerHTML = '';
    sheetUrls.forEach((u, i) => {
      const img = new Image();
      img.className = 'sheet'; img.src = u; img.alt = `印刷プレビュー ${i + 1}ページ目`;
      box.append(img);
    });
    const note = $('#pPages');
    note.hidden = pages.length < 2;
    note.textContent = `メンバーが${state.members.length}人いるため、${per}人ずつ ${pages.length} ページに分けて出力します。`;
  }

  function fitText(g, text, x, y, max) {
    if (g.measureText(text).width <= max) return g.fillText(text, x, y);
    let s = text;
    while (s.length > 1 && g.measureText(s + '…').width > max) s = s.slice(0, -1);
    g.fillText(s + '…', x, y);
  }
  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // A4 を 300dpi 相当（2480×3508px）で描画
  function drawSheet(fromH, toH, landscape, members, pageNo, pageCount) {
    const W = landscape ? 3508 : 2480, H = landscape ? 2480 : 3508, M = 110;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);

    const [y, mo, d] = curDate.split('-').map(Number);
    const now = new Date();
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#1c2330'; g.font = `bold 64px ${SHEET_FONT}`;
    g.fillText(`${y}年${mo}月${d}日（${WEEK[new Date(y, mo - 1, d).getDay()]}）のスケジュール${pageCount > 1 ? `（${pageNo}/${pageCount}）` : ''}`, M, M + 60);
    g.fillStyle = '#667085'; g.font = `30px ${SHEET_FONT}`;
    g.fillText(`${pad(fromH)}:00–${pad(toH)}:00　1マス＝10分`, M, M + 110);
    g.textAlign = 'right';
    g.fillText(`出力 ${dateStr(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`, W - M, M + 110);
    g.textAlign = 'left';

    const top = M + 160, headH = 80, timeW = 130, bottom = H - M;
    const colW = (W - 2 * M - timeW) / members.length;
    const from = fromH * 6, to = toH * 6, n = to - from;
    const gy = top + headH, rowH = (bottom - gy) / n;

    g.fillStyle = '#f1f4f9'; g.fillRect(M, top, W - 2 * M, headH);
    g.textBaseline = 'middle';
    members.forEach((m, i) => {
      const x = M + timeW + i * colW;
      g.fillStyle = m.color; g.beginPath(); g.arc(x + 34, top + headH / 2, 13, 0, Math.PI * 2); g.fill();
      g.save(); g.beginPath(); g.rect(x, top, colW, headH); g.clip();
      g.fillStyle = '#1c2330'; g.font = `bold 34px ${SHEET_FONT}`;
      fitText(g, m.name, x + 58, top + headH / 2, colW - 70);
      g.restore();
    });

    for (let i = 0; i <= n; i++) {
      const s = from + i, yy = gy + i * rowH, hour = s % 6 === 0, half = s % 3 === 0;
      g.strokeStyle = hour ? '#8a94a6' : half ? '#d0d5dd' : '#eaecf0';
      g.lineWidth = hour ? 3 : 2;
      g.setLineDash(hour || half ? [] : [8, 8]);
      g.beginPath(); g.moveTo(M + (hour ? 0 : timeW), yy); g.lineTo(W - M, yy); g.stroke();
      if (hour && i < n) {
        g.fillStyle = '#475467'; g.font = `bold 30px ${SHEET_FONT}`; g.textBaseline = 'top';
        g.fillText(slotLabel(s), M + 10, yy + 8);
      }
    }
    g.setLineDash([]);
    g.strokeStyle = '#d0d5dd'; g.lineWidth = 2;
    for (let i = 0; i <= members.length; i++) {
      const x = M + timeW + i * colW;
      g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke();
    }
    g.strokeStyle = '#8a94a6'; g.lineWidth = 3; g.strokeRect(M, top, W - 2 * M, bottom - top);

    const fs = Math.max(18, Math.min(30, rowH * 0.8));
    members.forEach((m, i) => {
      const x = M + timeW + i * colW;
      for (const ev of state.events) {
        if (ev.date !== curDate || ev.memberId !== m.id) continue;
        const a = Math.max(ev.start, from), b = Math.min(ev.end, to);
        if (b <= a) continue;
        const ex = x + 6, ey = gy + (a - from) * rowH + 3, ew = colW - 12, eh = (b - a) * rowH - 6;
        g.fillStyle = m.color; roundRect(g, ex, ey, ew, eh, 10); g.fill();
        g.save(); g.beginPath(); g.rect(ex, ey, ew, eh); g.clip();
        g.fillStyle = '#ffffff';
        const title = ev.title || '(無題)', time = `${slotLabel(ev.start)}–${slotLabel(ev.end)}`;
        const small = Math.floor(Math.min(fs, (eh - 4) * 0.8));   // 枠が低い予定は文字を縮める
        if (small < 12) {
          // 文字が読めない高さなので色帯のみ
        } else if (eh >= fs * 2.6) {
          g.textBaseline = 'top';
          g.font = `bold ${fs}px ${SHEET_FONT}`; fitText(g, title, ex + 12, ey + 8, ew - 24);
          g.font = `${Math.round(fs * 0.85)}px ${SHEET_FONT}`; fitText(g, time, ex + 12, ey + 8 + fs * 1.3, ew - 24);
        } else {
          g.textBaseline = 'middle';
          g.font = `bold ${small}px ${SHEET_FONT}`; fitText(g, `${title}  ${time}`, ex + 12, ey + eh / 2, ew - 24);
        }
        g.restore();
      }
    });
    return cv;
  }

  $('#pSave').addEventListener('click', async () => {
    for (let i = 0; i < sheetUrls.length; i++) {
      const name = `schedule-${curDate}${sheetUrls.length > 1 ? `-${i + 1}` : ''}.png`;
      if (!(await saveFile(name, dataUrlToBlob(sheetUrls[i])))) break;   // 1枚ずつ確認
    }
  });
  $('#pPrint').addEventListener('click', () => {
    $('#printPage').textContent = `@page { size: A4 ${$('#pOrient').value}; margin: 0; }`;
    const area = $('#printArea');
    area.innerHTML = '';
    const loads = sheetUrls.map((u) => new Promise((res) => {
      const img = new Image();
      img.onload = img.onerror = res;
      img.src = u; img.alt = '';
      area.append(img);
    }));
    Promise.all(loads).then(() => { printDlg.close(); setTimeout(() => window.print(), 50); });
  });

  // ===== 通知（Notification API） =====
  const notifBtn = $('#notif');
  function updateNotifBtn() {
    if (!('Notification' in window)) { notifBtn.textContent = '🔔 画面内で通知'; return; }
    notifBtn.textContent = { granted: '🔔 通知ON', denied: '🔕 通知ブロック中', default: '🔔 通知を許可' }[Notification.permission];
  }
  notifBtn.addEventListener('click', async () => {
    if (!('Notification' in window)) {
      return toast('このブラウザは通知に対応していないため、ページを開いている間は画面内でお知らせします。', 5000);
    }
    if (Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch { /* 許可を求められない環境 */ }
      updateNotifBtn();
      if (Notification.permission === 'granted') showNotification('通知が有効になりました', '予定の開始前にお知らせします', 'tenmin-test');
      else toast('通知を許可できませんでした。ページを開いている間は画面内でお知らせします。', 5000);
    } else if (Notification.permission === 'granted') {
      showNotification('テスト通知', 'このように表示されます', 'tenmin-test');
    } else {
      toast('通知がブロックされています。ページを開いている間は画面内でお知らせします。', 5000);
    }
  });

  function showNotification(title, body, tag) {
    toast(`${title}　${body}`, 8000);          // 画面内にも必ず表示
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification(title, { body, tag }); }
    catch { /* Android Chrome 等は Service Worker 経由でのみ表示可能（本番版で対応） */ }
  }

  function checkReminders() {
    const now = Date.now();
    const notified = readJSON(NOTIFIED_KEY, {});
    const only = readJSON(NOTIFY_FOR_KEY, '');
    let changed = false;
    for (const ev of state.events) {
      if (!ev.remind || (only && ev.memberId !== only)) continue;
      const [y, m, d] = ev.date.split('-').map(Number);
      const start = new Date(y, m - 1, d, 0, ev.start * 10).getTime();
      const key = `${ev.id}@${ev.date}@${ev.start}@${ev.remind}`;
      if (now >= start - ev.remind * 60000 && now < start && !notified[key]) {
        notified[key] = now; changed = true;
        const member = state.members.find((x) => x.id === ev.memberId);
        const mins = Math.max(1, Math.ceil((start - now) / 60000));
        showNotification(`⏰ ${mins}分後: ${ev.title || '(無題)'}`,
          `${slotLabel(ev.start)}–${slotLabel(ev.end)}${member ? ` / ${member.name}` : ''}`, key);
      }
    }
    for (const k in notified) if (now - notified[k] > 2 * 86400000) { delete notified[k]; changed = true; }
    if (changed) writeJSON(NOTIFIED_KEY, notified);
  }

  // ===== トースト =====
  let toastTimer;
  function toast(msg, ms = 3000) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ===== 起動・同期 =====
  function onSharedChange() {
    render();
    // メンバー画面を開いていて、名前を入力中でなければ一覧を最新にする
    if (memberDlg.open && !(document.activeElement && document.activeElement.matches('#memberList input'))) renderMembers();
  }

  const hasClaude = () => !!(window.claude && typeof window.claude.use === 'function');
  async function connectClaude() {
    if (!hasClaude()) return null;
    try { return await window.claude.use('db'); } catch { return null; }
  }

  // ----- Firebase（誰でもリンクで参加できる共有） -----
  const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const firebaseConfig = () => {
    const c = window.FIREBASE_CONFIG;
    return !FRAMED && c && c.apiKey && c.projectId ? c : null;
  };
  // 予定表ID（URL の ?b=）。推測できない長さのランダム文字列
  const boardId = () => {
    const b = new URLSearchParams(location.search).get('b');
    return b && /^[A-Za-z0-9_-]{16,64}$/.test(b) ? b : null;
  };
  function createBoard() {
    const bytes = crypto.getRandomValues(new Uint8Array(15));
    const id = btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_');
    location.search = '?b=' + id;
  }
  // Firestore を、claude.ai の共有データと同じ形（collection().doc().set/delete, onSnapshot）で包む
  async function connectFirebase(cfg, board) {
    const [appM, authM, fsM] = await Promise.all([
      import(FIREBASE_SDK + 'firebase-app.js'),
      import(FIREBASE_SDK + 'firebase-auth.js'),
      import(FIREBASE_SDK + 'firebase-firestore.js'),
    ]);
    const app = appM.initializeApp(cfg);
    await authM.signInAnonymously(authM.getAuth(app));
    const fs = fsM.getFirestore(app);
    const mapErr = (e) => {
      const c = e && e.code;
      throw { code: c === 'permission-denied' ? 'rejected' : c === 'resource-exhausted' ? 'resource_exhausted'
        : c === 'unavailable' ? 'unavailable' : 'unknown', message: String(e && e.message) };
    };
    return {
      collection: (name) => ({
        doc: (id) => ({
          set: (data) => fsM.setDoc(fsM.doc(fs, 'boards', board, name, id), data).catch(mapErr),
          delete: () => fsM.deleteDoc(fsM.doc(fs, 'boards', board, name, id)).catch(mapErr),
        }),
        onSnapshot: (next, error) => fsM.onSnapshot(fsM.collection(fs, 'boards', board, name),
          (snap) => next({ docs: snap.docs.map((d) => ({ id: d.id, exists: true, data: () => d.data() })) }),
          error),
      }),
    };
  }

  // 招待リンク
  const inviteDlg = $('#inviteDlg');
  $('#invite').addEventListener('click', async () => {
    const url = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: '10分スケジュール', text: '予定表に招待します', url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    $('#inviteUrl').value = url;
    $('#inviteCopy').textContent = 'コピー';
    inviteDlg.showModal();
  });
  $('#inviteCopy').addEventListener('click', () => {
    const input = $('#inviteUrl'), btn = $('#inviteCopy');
    const fallback = () => { input.focus(); input.select(); btn.textContent = '選択しました（長押しでコピー）'; };
    try { navigator.clipboard.writeText(input.value).then(() => { btn.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
  });
  $('#inviteForm').addEventListener('submit', (e) => { e.preventDefault(); inviteDlg.close(); });

  function startLocal(reason) {
    mode = 'local';
    state = loadLocal();
    updateStatus(); render(); scrollToNow();
    // 同じブラウザの別タブで変更されたら即時反映
    window.addEventListener('storage', (e) => {
      if (e.key === KEY) { state = loadLocal(); render(); }
    });
    if (reason) toast(reason, 6000);
  }

  function startShared(store, via) {
    db = store;
    backend = via;
    mode = 'shared';
    let gotMembers = false, gotEvents = false, scrolled = false;
    const ready = () => {
      if (gotMembers && gotEvents) {
        onSharedChange();
        if (!scrolled) { scrolled = true; scrollToNow(); }
      }
    };
    const onError = () => {
      toast('共有データとの接続が切れました。ページを開き直してください。', 8000);
    };
    db.collection('members').onSnapshot((snap) => {
      state.members = snap.docs.map((d) => cleanMember(d.id, d.data() || {})).sort(byOrder);
      gotMembers = true; ready();
    }, onError);
    db.collection('events').onSnapshot((snap) => {
      state.events = snap.docs.map((d) => cleanEvent(d.id, d.data() || {}));
      gotEvents = true; ready();
    }, onError);
    updateStatus();
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearAnchor(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { drawNowLine(); checkReminders(); } });
  setInterval(drawNowLine, 60000);
  setInterval(checkReminders, 15000);

  dateInput.value = curDate;
  applyZoom(false);
  updateNotifBtn();
  updateStatus();
  updateSaveButtons();
  render();

  if (hasClaude()) {
    window.claude.use('downloads').then((d) => { downloads = d; updateSaveButtons(); }, () => {});
  }

  (async () => {
    const cfg = firebaseConfig();
    if (cfg) {
      const b = boardId();
      if (!b) { mode = 'noboard'; updateStatus(); render(); return; }
      try {
        startShared(await connectFirebase(cfg, b), 'firebase');
      } catch {
        startLocal('共有サーバーに接続できないため、この端末だけで動作しています。通信状態を確認して開き直してください。');
      }
    } else {
      const store = await connectClaude();
      if (store) startShared(store, 'claude');
      else startLocal(FRAMED ? '共有データに接続できないため、この端末だけで動作しています。' : '');
    }
    checkReminders();
  })();
})();
</script>
